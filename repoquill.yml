# RepoQuill configuration
# Docs: https://github.com/SushantGautam/RepoQuill#config
# Edit your .github/workflows/docs.yml for CI/CD configuration

project_name: repoquill
package_dir: repoquill

llm:
  provider: openai
  model: Qwen/Qwen3.8-27B-FP8
  base_url: https://simulachat.sushant.info.np/api/v1
  api_key_env: OPENAI_API_KEY

site:
  name: repoquill
  description: "Documentation for repoquill"
  url: https://SushantGautam.github.io/RepoQuill/
  repo_url: https://github.com/SushantGautam/RepoQuill
  repo_name: SushantGautam/RepoQuill

narrative_sections:
  - title: Getting Started
    slugs: [quickstart, installation]
  - title: Core Concepts
    slugs: [architecture, key-ideas]

reference_sections:
  - title: Core
    modules: [repoquill]

index:
  tagline: "Documentation for repoquill"
  quick_start:
    install: "pip install repoquill"
