# ============================================================================
# RepoQuill — publish to PyPI on release
#
# Triggered when a GitHub Release is published (e.g. `gh release create v0.2.0`).
# The release tag (vX.Y.Z) must match the version in pyproject.toml.
#
# Requires a `PYPI_API_TOKEN` secret in the repo
# (Settings → Secrets and variables → Actions).
# Create one at https://pypi.org/manage/account/token/
# ============================================================================
name: Publish to PyPI

on:
  release:
    types: [published]

# Serialized: at most one PyPI publish at a time; never cancel an in-flight
# publish (a cancelled publish can leave a half-uploaded release).
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; no other grants needed
      id-token: write # required for trusted publishing (if configured)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distributions
        run: python -m pip install twine && twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
