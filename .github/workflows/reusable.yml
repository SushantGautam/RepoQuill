# ============================================================================
# RepoQuill — reusable docs-generation workflow
#
# Any repository can call this workflow to generate + build its docs with
# RepoQuill. The consuming repo provides:
#   - a `repoquill.yml` config (at repo root or docs/)
#   - the LLM API key as a secret (name configurable via `api_key_secret`)
#
# Two-stage safety contract (P0-5):
#   1. `validate` (read-only, contents: read): generates + builds the docs
#      and uploads the generated docs/ tree and the built site as artifacts.
#      It never commits or pushes. On any failure the workflow stops here
#      and nothing is published, so a failed generation can never ship.
#   2. `publish` (trusted only): runs only when `publish` is "true" (the
#      default) and never in pull_request / pull_request_target contexts.
#      Holds contents: write, uses only GITHUB_TOKEN (no LLM key), and
#      commits + pushes the validated docs uploaded by `validate`.
#   3. `deploy`: optional GitHub Pages deploy, only when a `deploy_branch`
#      is set and the `publish` job actually ran.
#
# Set `publish: "false"` to validate only (e.g. PR checks) without
# committing or pushing anything.
#
# See README.md for the full "how to use this in your repo" guide.
# ============================================================================
name: RepoQuill Docs

on:
  workflow_call:
    inputs:
      # Path to the repoquill.yml config file (relative to repo root).
      config:
        description: "Path to repoquill.yml"
        required: false
        default: "repoquill.yml"
        type: string
      # RepoQuill ref (branch/tag/commit) used to run the generator. Default
      # 'main'; set this to a ref that includes the Pi engine when the config
      # requests `documentation.engine: pi`. Pin a release/tag for stability.
      repoquill_ref:
        description: "RepoQuill ref (branch/tag/commit) to run for generation"
        required: false
        default: "main"
        type: string
      # Name of the GitHub secret that holds the LLM API key.
      api_key_secret:
        description: "Name of the secret containing the LLM API key"
        required: false
        default: "LLM_API_KEY"
        type: string
      # Name of the environment variable the LLM client reads the key from.
      # Must match `api_key_env` in repoquill.yml.
      api_key_env:
        description: "Env var name the LLM client reads (must match repoquill.yml api_key_env)"
        required: false
        default: "OPENAI_API_KEY"
        type: string
      # Set to "true" to skip LLM narrative generation (deterministic reference only).
      no_llm:
        description: "Skip LLM narrative pages (reference only)"
        required: false
        default: "false"
        type: string
      # Python version for the runner.
      python_version:
        description: "Python version"
        required: false
        default: "3.11"
        type: string
      # Install the optional local-RAG extra (sentence-transformers).
      install_rag:
        description: "Install the [rag] extra (local embeddings)"
        required: false
        default: "false"
        type: string
      # Branch to deploy the built site to (empty = no deploy).
      deploy_branch:
        description: "Branch to deploy site/ to (e.g. gh-pages). Empty to skip deploy."
        required: false
        default: ""
        type: string
      # Folder in the consuming repo where the built site should be published
      # from (e.g. "docs" if the site is built into docs/site).
      deploy_path:
        description: "Path to the built site/ folder for deployment"
        required: false
        default: "site"
        type: string
      # Set to "true" to delete all previously generated docs before regenerating.
      clean:
        description: "Delete docs/ before generating (forces full regeneration)"
        required: false
        default: "false"
        type: string
      # Set to "false" to validate only without committing/pushing.
      publish:
        description: "Set to false to validate only without committing/pushing"
        required: false
        default: "true"
        type: string
    secrets:
      LLM_API_KEY:
        description: "LLM API key (wired into the env var named by api_key_env)"
        required: true

# One docs run per repo+config at a time; never cancel an in-flight run so
# two runs can never race on the docs commit/push.
concurrency:
  group: ${{ github.repository }}-docs-${{ inputs.config }}
  cancel-in-progress: false

jobs:
  # Stage 1: generate + build (read-only). Uploads the generated docs/ tree
  # and the built site as artifacts; never touches git.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout RepoQuill
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/RepoQuill
          ref: ${{ inputs.repoquill_ref }}
          path: _repoquill

      - name: Read source repo from config
        id: src
        run: |
          CFG="${{ inputs.config }}"
          [ -f "$CFG" ] || CFG="repoquill.yml"
          SRC_REPO=$(grep -E '^source_repo:' "$CFG" | sed 's/^source_repo:[[:space:]]*//' | tr -d '"' || true)
          SRC_REF=$(grep -E '^source_ref:' "$CFG" | sed 's/^source_ref:[[:space:]]*//' | tr -d '"' || true)
          echo "repo=${SRC_REPO}" >> "$GITHUB_OUTPUT"
          echo "ref=${SRC_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        if: steps.src.outputs.repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.ref || 'main' }}
          path: source

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python_version }}

      # --- Pi engine (optional) ---------------------------------------
      # Provision Node + the pinned Pi runtime only when the config requests
      # the Pi narrative engine (`documentation.engine: pi`). Deterministic and
      # legacy generations need neither, so these steps are a no-op for them.
      - name: Detect Pi engine
        id: pi_engine
        run: |
          CFG="${{ inputs.config }}"
          [ -f "$CFG" ] || CFG="repoquill.yml"
          if grep -qE '^[[:space:]]*engine:[[:space:]]*pi[[:space:]]*$' "$CFG"; then
            echo "use_pi=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_pi=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js (Pi engine)
        if: steps.pi_engine.outputs.use_pi == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preprovision pinned Pi runtime (Pi engine)
        if: steps.pi_engine.outputs.use_pi == 'true'
        run: |
          CACHE="$HOME/.cache/repoquill/pi"
          mkdir -p "$CACHE"
          printf '{"name":"repoquill-pi-cache","private":true,"version":"0.0.0"}\n' > "$CACHE/package.json"
          npm install --prefix "$CACHE" --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@1.2.0"
          echo "pi version: $("$CACHE/node_modules/.bin/pi" --version 2>/dev/null || echo 'n/a')"

      - name: Clean previously generated docs
        if: inputs.clean == 'true'
        run: rm -rf docs/

      - name: Generate docs
        env:
          REPOQUILL_API_KEY: ${{ secrets.LLM_API_KEY }}
          SOURCE_ROOT: ${{ steps.src.outputs.repo != '' && format('{0}/source', github.workspace) || '' }}
        run: |
          export ${{ inputs.api_key_env }}="${REPOQUILL_API_KEY}"
          NO_LLM_FLAG=""
          if [ "${{ inputs.no_llm }}" = "true" ]; then
            NO_LLM_FLAG="--no-llm"
          fi
          RAG=""
          if [ "${{ inputs.install_rag }}" = "true" ]; then RAG="[rag]"; fi
          uvx --from "./_repoquill${RAG}" repoquill generate $NO_LLM_FLAG --config ${{ inputs.config }} --build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-tree
          path: docs

      - name: Upload site artifact
        if: inputs.deploy_branch != ''
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ inputs.deploy_path }}

  # Stage 2: trusted publishing. Only runs after a successful validate, only
  # when publishing is requested, and never in PR trigger contexts.
  publish:
    needs: validate
    if: inputs.publish == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated docs
        uses: actions/download-artifact@v4
        with:
          name: docs-tree
          path: _generated_docs

      - name: Commit and push docs
        run: |
          CFG="${{ inputs.config }}"
          [ -f "$CFG" ] || CFG="repoquill.yml"
          rm -rf docs
          mkdir -p docs
          cp -a _generated_docs/. docs/
          rm -rf _generated_docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ "$CFG"
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate [skip ci]" && git push
          fi

  deploy:
    if: inputs.deploy_branch != '' && inputs.publish == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: ${{ inputs.deploy_branch }}
