# ============================================================================
# RepoQuill — reusable docs-generation workflow
#
# Any repository can call this workflow to generate + build its docs with
# RepoQuill. The consuming repo provides:
#   - a `repoquill.yml` config (at repo root or docs/)
#   - the LLM API key as a secret (name configurable via `api_key_secret`)
#
# See README.md for the full "how to use this in your repo" guide.
# ============================================================================
name: RepoQuill Docs

on:
  workflow_call:
    inputs:
      # Path to the repoquill.yml config file (relative to repo root).
      config:
        description: "Path to repoquill.yml"
        required: false
        default: "repoquill.yml"
        type: string
      # Name of the GitHub secret that holds the LLM API key.
      api_key_secret:
        description: "Name of the secret containing the LLM API key"
        required: false
        default: "LLM_API_KEY"
        type: string
      # Name of the environment variable the LLM client reads the key from.
      # Must match `api_key_env` in repoquill.yml.
      api_key_env:
        description: "Env var name the LLM client reads (must match repoquill.yml api_key_env)"
        required: false
        default: "OPENAI_API_KEY"
        type: string
      # Set to "true" to skip LLM narrative generation (deterministic reference only).
      no_llm:
        description: "Skip LLM narrative pages (reference only)"
        required: false
        default: "false"
        type: string
      # Python version for the runner.
      python_version:
        description: "Python version"
        required: false
        default: "3.11"
        type: string
      # Install the optional local-RAG extra (sentence-transformers).
      install_rag:
        description: "Install the [rag] extra (local embeddings)"
        required: false
        default: "false"
        type: string
      # Branch to deploy the built site to (empty = no deploy).
      deploy_branch:
        description: "Branch to deploy site/ to (e.g. gh-pages). Empty to skip deploy."
        required: false
        default: ""
        type: string
      # Folder in the consuming repo where the built site should be published
      # from (e.g. "docs" if the site is built into docs/site).
      deploy_path:
        description: "Path to the built site/ folder for deployment"
        required: false
        default: "site"
        type: string
    secrets:
      LLM_API_KEY:
        description: "LLM API key (wired into the env var named by api_key_env)"
        required: true

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout RepoQuill
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/RepoQuill
          ref: main
          path: _repoquill

      - name: Read source repo from config
        id: src
        run: |
          CFG="${{ inputs.config }}"
          [ -f "$CFG" ] || CFG="repoquill.yml"
          SRC_REPO=$(grep -E '^source_repo:' "$CFG" | sed 's/^source_repo:[[:space:]]*//' | tr -d '"' || true)
          SRC_REF=$(grep -E '^source_ref:' "$CFG" | sed 's/^source_ref:[[:space:]]*//' | tr -d '"' || true)
          echo "repo=${SRC_REPO}" >> "$GITHUB_OUTPUT"
          echo "ref=${SRC_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        if: steps.src.outputs.repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.ref || 'main' }}
          path: source

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Generate docs
        env:
          LLM_API_KEY: ${{ secrets[inputs.api_key_secret] }}
          SOURCE_ROOT: ${{ steps.src.outputs.repo != '' && format('{0}/source', github.workspace) || '' }}
        run: |
          export ${{ inputs.api_key_env }}="${LLM_API_KEY}"
          NO_LLM_FLAG=""
          if [ "${{ inputs.no_llm }}" = "true" ]; then
            NO_LLM_FLAG="--no-llm"
          fi
          RAG=""
          if [ "${{ inputs.install_rag }}" = "true" ]; then RAG="[rag]"; fi
          uvx --from "./_repoquill${RAG}" repoquill generate $NO_LLM_FLAG --config ${{ inputs.config }} --build

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate [skip ci]" && git push
          fi

      - name: Upload site artifact
        if: inputs.deploy_branch != ''
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ inputs.deploy_path }}

  deploy:
    if: inputs.deploy_branch != ''
    needs: generate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: ${{ inputs.deploy_branch }}
