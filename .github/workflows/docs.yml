name: Docs

on:
  push:
    branches: [main]
  # Daily reconciliation (M4): the retry-safe manifest re-attempts pages
  # that failed or were left unverified by an earlier run and picks up
  # source drift. Runs are cheap no-ops when everything is already
  # verified (unchanged pages skip LLM calls entirely). A schedule on the
  # default branch is a trusted publishing context, like push/dispatch.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      clean:
        description: "Delete docs/ before generating (forces full regeneration)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Serialized: never cancel an in-flight docs run so two runs can never race
# on the docs commit/push inside the reusable workflow.
concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: false

# Required: the reusable workflow's publish job (contents: write) commits
# generated docs back to this repo, and reusable-workflow job permissions
# are capped by the caller's workflow-level permissions. This workflow only
# runs in trusted contexts (push to main / schedule / manual dispatch),
# so no privileged push ever happens from PRs.
permissions:
  contents: write

jobs:
  docs:
    uses: SushantGautam/RepoQuill/.github/workflows/reusable.yml@main
    with:
      config: repoquill.yml
      api_key_secret: LLM_API_KEY
      api_key_env: OPENAI_API_KEY
      deploy_branch: gh-pages
      deploy_path: site_repoquill
      clean: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.clean || 'false' }}
      publish: "true"
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
